<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaria · Migración</title>
    <link rel="stylesheet" href="./css/polaria.css">
</head>
<body>

<header class="topbar">
    <span class="topbar-date" id="fechaHoy"></span>
    <a class="brand" href="./index.html"><span>✦</span> polaria</a>
    <nav class="topbar-nav">
        <a href="./index.html">Explorer</a>
        <a href="./dashboard.html">Tablero</a>
        <a class="active" href="./migracion.html">Migración</a>
    </nav>
</header>

<div class="page">
    <div class="crumb">Inicio / <b>Migración</b></div>
    <h1>Migración</h1>
    <p class="subtitle">SQL Server → Supabase · esquema <code>emp_jbr_cygnus_y9ihz</code></p>

    <div class="container">
        <div id="status" class="status waiting">Sin conectar</div>

        <div class="actions">
            <button id="btnConectar" class="execute" onclick="conectar()">Conectar</button>
            <button id="btnProductos" onclick="migrarProductos()">Migrar productos</button>
            <button id="btnClientes" onclick="migrarClientes()">Migrar clientes</button>
            <button id="btnBodegas" onclick="migrarBodegas()">Migrar bodegas</button>
        </div>

        <div id="detalle"></div>
    </div>

    <p class="footer-note">version: appjbr</p>
</div>

<script>
document.getElementById("fechaHoy").textContent =
    "Fecha " + new Date().toLocaleDateString("es-MX");

async function leerJson(response) {
    const texto = await response.text();
    try {
        return JSON.parse(texto);
    } catch (_error) {
        throw new Error(
            "El servidor no respondió JSON. Abre la página en http://localhost:3000/migracion.html y reinicia con npm start."
        );
    }
}

async function conectar() {

    const status = document.getElementById("status");
    const detalle = document.getElementById("detalle");
    const boton = document.getElementById("btnConectar");

    detalle.innerHTML = "";
    boton.disabled = true;
    status.className = "status waiting";
    status.textContent = "Conectando...";

    try {
        const response = await fetch("/api/conectar", { method: "POST" });
        const data = await leerJson(response);

        if (!response.ok || !data.ok) {
            throw new Error(data.error || "Error de conexión");
        }

        status.className = "status success";
        status.textContent = "Conectado a " + data.schema;

    } catch (error) {
        status.className = "status error";
        status.textContent = "No se pudo conectar";
        detalle.innerHTML = `<div class="warning">${escapeHtml(error.message)}</div>`;
    } finally {
        boton.disabled = false;
    }
}

async function migrarProductos() {

    const status = document.getElementById("status");
    const detalle = document.getElementById("detalle");
    const boton = document.getElementById("btnProductos");

    detalle.innerHTML = "";
    boton.disabled = true;
    status.className = "status waiting";
    status.textContent = "Migrando productos...";

    try {
        const response = await fetch("/api/migrar/productos", { method: "POST" });
        const data = await leerJson(response);

        if (!response.ok || !data.ok) {
            throw new Error(data.error || "Error migrando productos");
        }

        status.className = "status success";
        status.textContent = data.total + " productos en " + data.codigo_cuenta;

        if (data.omitidos) {
            detalle.innerHTML = `<div class="warning">${data.omitidos} fila(s) omitida(s)</div>`;
        }

    } catch (error) {
        status.className = "status error";
        status.textContent = "No se pudieron migrar los productos";
        detalle.innerHTML = `<div class="warning">${escapeHtml(error.message)}</div>`;
    } finally {
        boton.disabled = false;
    }
}

        detalle.innerHTML = `<div class="warning">${escapeHtml(error.message)}</div>`;

        boton.disabled = false;
    }
}

async function migrarBodegas() {

    const status = document.getElementById("status");
    const detalle = document.getElementById("detalle");
    const boton = document.getElementById("btnBodegas");

    detalle.innerHTML = "";
    boton.disabled = true;
    status.className = "status waiting";
    status.textContent = "Migrando bodegas...";

    try {
        const response = await fetch("/api/migrar/bodegas", { method: "POST" });
        const data = await leerJson(response);

        if (!response.ok || !data.ok) {
            throw new Error(data.error || "Error migrando bodegas");
        }

        status.className = "status success";
        status.textContent = data.total + " bodegas en " + data.codigo_cuenta;

        if (data.omitidos) {
            detalle.innerHTML = `<div class="warning">${data.omitidos} fila(s) omitida(s)</div>`;
        }

    } catch (error) {
        status.className = "status error";
        status.textContent = "No se pudieron migrar las bodegas";
        detalle.innerHTML = `<div class="warning">${escapeHtml(error.message)}</div>`;
    } finally {
        boton.disabled = false;
    }
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>

</body>
</html>
