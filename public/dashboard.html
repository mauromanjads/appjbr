<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaria · Tablero 1</title>
    <link rel="stylesheet" href="./css/polaria.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<header class="topbar">
    <span class="topbar-date" id="fechaHoy"></span>
    <a class="brand" href="./index.html"><span>✦</span> polaria</a>
    <nav class="topbar-nav">
        <a href="./index.html">Explorer</a>
        <a class="active" href="./dashboard.html">Tablero</a>
        <a href="./migracion.html">Migración</a>
    </nav>
</header>

<div class="page">
    <div class="crumb">Inicio / <b>Tablero 1</b></div>
    <h1>Compras, ventas e inventario</h1>
    <p class="subtitle">SQL Server · rango de fechas sobre movimientos · inventario actual almacén 8</p>

    <div class="container">
        <div id="status" class="status waiting">Elige el rango de fechas y carga el tablero</div>

        <div class="filtros">
            <div class="campo">
                <label for="fechaInicio">Fecha inicio</label>
                <input id="fechaInicio" type="date" value="2026-07-01">
            </div>
            <div class="campo">
                <label for="fechaFin">Fecha fin</label>
                <input id="fechaFin" type="date" value="2026-09-01">
            </div>
            <div class="actions">
                <button id="btnCargar" class="execute" onclick="cargarTablero()">Cargar tablero</button>
                <span class="info">Consulta: consultas/tablero-1-inventario.sql</span>
            </div>
        </div>

        <div id="resultContainer"></div>
    </div>

    <p class="footer-note">version: appjbr</p>
</div>

<script>
document.getElementById("fechaHoy").textContent =
    "Fecha " + new Date().toLocaleDateString("es-MX");

const API_URL = "https://fleshed-jittery-swiftly.ngrok-free.dev/query";
const SQL_URL = "./consultas/tablero-1-inventario.sql";

const EXCLUIR_SUMA = /^(id|idproducto|codigoproducto|codigo|sku|nombreproducto|nombre|unidad)$/i;
const OCULTAR_COLUMNAS = /^(unidad|cabreviatura)$/i;
const RATIOS = {
    CostoUnitario: ["CostoTotalCompra", "CantidadCompra"],
    VentaUnitaria: ["VentaTotal", "CantidadVenta"],
    MermaDesecho: ["CantidadMerma", "CantidadCompra"]
};

const DECIMALES_1 = {
    CantidadCompra: true,
    CantidadVenta: true,
    CantidadMerma: true,
    ExistenciaActual: true
};

const DINERO_ENTERO = {
    CostoTotalCompra: true,
    VentaTotal: true,
    CostoTotalMerma: true,
    ValorInventario: true
};

const DINERO_2DEC = {
    CostoUnitario: true,
    VentaUnitaria: true
};

const PORCENTAJE_1 = {
    MermaDesecho: true
};

let resultadosActuales = [];
let columnasTabla = [];
let numericasTabla = {};
let filtrosTabla = {};
let ordenTabla = { col: null, dir: 1 };
let plantillaSql = null;
let graficos = [];

function esFechaIso(valor) {
    return /^\d{4}-\d{2}-\d{2}$/.test(valor);
}

function aNumero(valor) {
    if (valor === null || valor === undefined || valor === "") {
        return null;
    }
    if (typeof valor === "number") {
        return Number.isFinite(valor) ? valor : null;
    }
    const n = Number(String(valor).replace(/,/g, ""));
    return Number.isFinite(n) ? n : null;
}

function esColumnaNumerica(nombre, rows) {
    if (DECIMALES_1[nombre] || RATIOS[nombre] || DINERO_ENTERO[nombre] || DINERO_2DEC[nombre] || PORCENTAJE_1[nombre]) {
        return true;
    }
    if (EXCLUIR_SUMA.test(nombre)) {
        return false;
    }
    let vistos = 0;
    for (let i = 0; i < rows.length; i++) {
        const n = aNumero(rows[i][nombre]);
        if (n === null) {
            continue;
        }
        vistos += 1;
    }
    return vistos > 0;
}

function sumaColumna(rows, nombre) {
    return rows.reduce(function (acc, row) {
        const n = aNumero(row[nombre]);
        return acc + (n === null ? 0 : n);
    }, 0);
}

function formatoNumero(valor, columna) {
    if (valor === null || valor === undefined || valor === "") {
        return "";
    }
    const n = aNumero(valor);
    if (n === null) {
        return String(valor);
    }
    if (PORCENTAJE_1[columna]) {
        return (n * 100).toLocaleString("es-MX", {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1
        }) + " %";
    }
    if (DINERO_2DEC[columna]) {
        return "$ " + n.toLocaleString("es-MX", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }
    if (DINERO_ENTERO[columna]) {
        const entero = Math.round(n);
        return "$ " + entero.toLocaleString("es-MX", {
            maximumFractionDigits: 0
        });
    }
    if (DECIMALES_1[columna]) {
        return n.toLocaleString("es-MX", {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1
        });
    }
    const dec = Math.abs(n) >= 100 ? 2 : 4;
    return n.toLocaleString("es-MX", {
        minimumFractionDigits: 0,
        maximumFractionDigits: dec
    });
}

function totalColumna(nombre, rows) {
    if (RATIOS[nombre]) {
        const num = sumaColumna(rows, RATIOS[nombre][0]);
        const den = sumaColumna(rows, RATIOS[nombre][1]);
        return den ? num / den : null;
    }
    if (!esColumnaNumerica(nombre, rows)) {
        return null;
    }
    return sumaColumna(rows, nombre);
}

async function obtenerPlantilla() {
    if (plantillaSql) {
        return plantillaSql;
    }

    const response = await fetch(SQL_URL, {
        headers: { "ngrok-skip-browser-warning": "true" }
    });

    if (!response.ok) {
        throw new Error("No se pudo leer consultas/tablero-1-inventario.sql");
    }

    plantillaSql = await response.text();
    return plantillaSql;
}

function armarConsulta(plantilla, fechaInicio, fechaFin) {
    return plantilla
        .split("__FECHA_INICIO__").join(fechaInicio)
        .split("__FECHA_FIN__").join(fechaFin);
}

async function cargarTablero() {

    const status = document.getElementById("status");
    const resultContainer = document.getElementById("resultContainer");
    const boton = document.getElementById("btnCargar");
    const fechaInicio = document.getElementById("fechaInicio").value;
    const fechaFin = document.getElementById("fechaFin").value;

    resultContainer.innerHTML = "";
    resultadosActuales = [];
    filtrosTabla = {};
    ordenTabla = { col: null, dir: 1 };
    destruirGraficos();

    if (!esFechaIso(fechaInicio) || !esFechaIso(fechaFin)) {
        status.className = "status error";
        status.textContent = "Indica fecha inicio y fecha fin";
        return;
    }

    if (fechaInicio > fechaFin) {
        status.className = "status error";
        status.textContent = "La fecha inicio no puede ser mayor que la fecha fin";
        return;
    }

    boton.disabled = true;
    status.className = "status waiting";
    status.textContent = "Cargando tablero " + fechaInicio + " a " + fechaFin + "...";

    try {
        const plantilla = await obtenerPlantilla();
        const query = armarConsulta(plantilla, fechaInicio, fechaFin);

        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "ngrok-skip-browser-warning": "true"
            },
            body: JSON.stringify({ query: query })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Error ejecutando la consulta");
        }

        status.className = "status success";
        status.textContent = "Tablero " + fechaInicio + " a " + fechaFin;
        mostrarResultados(data);

    } catch (error) {
        status.className = "status error";
        status.textContent = "Error";
        resultContainer.innerHTML = `
            <div class="warning">${escapeHtml(error.message)}</div>
        `;
    } finally {
        boton.disabled = false;
    }
}

function mostrarPestana(nombre) {
    document.querySelectorAll(".tab").forEach(function (btn) {
        btn.classList.toggle("active", btn.getAttribute("data-tab") === nombre);
    });
    document.querySelectorAll(".tab-panel").forEach(function (panel) {
        panel.classList.toggle("active", panel.id === "panel-" + nombre);
    });
}

function celdaTexto(column, raw) {
    if (numericasTabla[column]) {
        return formatoNumero(raw, column);
    }
    if (raw === null || raw === undefined) {
        return "";
    }
    if (typeof raw === "object") {
        return JSON.stringify(raw);
    }
    return String(raw);
}

function filasVisibles() {
    let rows = resultadosActuales.filter(function (row) {
        return columnasTabla.every(function (column) {
            const filtro = (filtrosTabla[column] || "").trim().toLowerCase();
            if (!filtro) {
                return true;
            }
            return celdaTexto(column, row[column]).toLowerCase().indexOf(filtro) !== -1;
        });
    });

    if (ordenTabla.col) {
        const col = ordenTabla.col;
        const dir = ordenTabla.dir;
        const numerica = numericasTabla[col];
        rows = rows.slice().sort(function (a, b) {
            const va = a[col];
            const vb = b[col];
            if (numerica) {
                const na = aNumero(va);
                const nb = aNumero(vb);
                if (na === null && nb === null) {
                    return 0;
                }
                if (na === null) {
                    return 1;
                }
                if (nb === null) {
                    return -1;
                }
                return (na - nb) * dir;
            }
            return String(va || "").localeCompare(String(vb || ""), "es", {
                numeric: true,
                sensitivity: "base"
            }) * dir;
        });
    }

    return rows;
}

function ordenarColumna(columna) {
    if (ordenTabla.col === columna) {
        ordenTabla.dir = ordenTabla.dir === 1 ? -1 : 1;
    } else {
        ordenTabla.col = columna;
        ordenTabla.dir = 1;
    }
    document.querySelectorAll(".sort-ind").forEach(function (el) {
        el.textContent = "";
    });
    const ind = document.querySelector('.sort-ind[data-col="' + columna + '"]');
    if (ind) {
        ind.textContent = ordenTabla.dir === 1 ? "▲" : "▼";
    }
    pintarCuerpoTabla();
}

function filtrarColumna(columna, valor) {
    filtrosTabla[columna] = valor;
    pintarCuerpoTabla();
}

function pintarCuerpoTabla() {
    const tbody = document.getElementById("tablaCuerpo");
    const tfoot = document.getElementById("tablaPie");
    const count = document.getElementById("rowCount");
    if (!tbody || !tfoot) {
        return;
    }

    const rows = filasVisibles();
    let html = "";

    rows.forEach(function (row) {
        html += "<tr>";
        columnasTabla.forEach(function (column) {
            html += "<td class=\"" + (numericasTabla[column] ? "num" : "") + "\">" +
                escapeHtml(celdaTexto(column, row[column])) + "</td>";
        });
        html += "</tr>";
    });

    tbody.innerHTML = html || "<tr><td colspan=\"" + columnasTabla.length +
        "\" class=\"empty\">Ningún registro coincide con el filtro.</td></tr>";

    let pie = "<tr>";
    columnasTabla.forEach(function (column, i) {
        if (i === 0) {
            pie += "<td>Total</td>";
            return;
        }
        const total = totalColumna(column, rows);
        pie += "<td class=\"" + (numericasTabla[column] ? "num" : "") + "\">" +
            (total === null ? "" : escapeHtml(formatoNumero(total, column))) + "</td>";
    });
    pie += "</tr>";
    tfoot.innerHTML = pie;

    if (count) {
        count.textContent = rows.length + " de " + resultadosActuales.length + " registros";
    }
}

function mostrarResultados(data) {

    const resultContainer = document.getElementById("resultContainer");
    const rows = data.rows || [];
    resultadosActuales = rows;
    filtrosTabla = {};
    ordenTabla = { col: null, dir: 1 };

    if (rows.length === 0) {
        resultContainer.innerHTML = `
            <div class="result-header">
                <h2>Resultado</h2>
                <span class="row-count">0 registros</span>
            </div>
            <div class="empty">La consulta no devolvió registros.</div>
        `;
        return;
    }

    columnasTabla = Object.keys(rows[0]).filter(function (column) {
        return !OCULTAR_COLUMNAS.test(column);
    });
    numericasTabla = {};
    columnasTabla.forEach(function (column) {
        numericasTabla[column] = esColumnaNumerica(column, rows) || !!RATIOS[column] || !!DECIMALES_1[column] || !!DINERO_ENTERO[column] || !!DINERO_2DEC[column] || !!PORCENTAJE_1[column];
    });

    let html = `
        <div class="result-header">
            <h2>Resultado</h2>
            <div class="result-actions">
                <span class="row-count" id="rowCount"></span>
                <button class="export" onclick="exportarExcel()">Exportar Excel</button>
            </div>
        </div>
        <div class="tabs">
            <button class="tab active" data-tab="tabla" onclick="mostrarPestana('tabla')">Tabla</button>
            <button class="tab" data-tab="dashboard" onclick="mostrarPestana('dashboard')">Dashboard</button>
        </div>
        <div id="panel-tabla" class="tab-panel active">
            <div class="table-container">
                <table>
                    <thead><tr>
    `;

    columnasTabla.forEach(function (column) {
        html += "<th class=\"" + (numericasTabla[column] ? "num" : "") + "\">" +
            "<button type=\"button\" class=\"th-sort\" onclick=\"ordenarColumna('" + column + "')\">" +
            escapeHtml(column) +
            "<span class=\"sort-ind\" data-col=\"" + column + "\"></span></button>" +
            "<input class=\"th-filter\" placeholder=\"Filtrar\" " +
            "oninput=\"filtrarColumna('" + column + "', this.value)\" " +
            "onclick=\"event.stopPropagation()\"></th>";
    });

    html += `</tr></thead>
                    <tbody id="tablaCuerpo"></tbody>
                    <tfoot id="tablaPie"></tfoot>
                </table>
            </div>
        </div>
        <div id="panel-dashboard" class="tab-panel">
            <div class="kpi-grid" id="kpiGrid"></div>
            <div class="charts">
                <div class="chart-card">
                    <h3>Top productos por venta ($)</h3>
                    <div class="chart-wrap"><canvas id="chartVentas"></canvas></div>
                </div>
                <div class="chart-card">
                    <h3>Top productos por venta (cantidades)</h3>
                    <div class="chart-wrap"><canvas id="chartCantidad"></canvas></div>
                </div>
                <div class="chart-card">
                    <h3>Compra vs venta vs merma (unidades)</h3>
                    <div class="chart-wrap"><canvas id="chartUnidades"></canvas></div>
                </div>
            </div>
        </div>
    `;

    resultContainer.innerHTML = html;
    pintarCuerpoTabla();
    pintarDashboard(rows);
}

function kpi(label, caption, valorTexto, sub) {
    return `
        <div class="kpi">
            <div class="kpi-label">${escapeHtml(label)}</div>
            <div class="kpi-caption">${escapeHtml(caption)}</div>
            <div class="kpi-value">${escapeHtml(valorTexto)}</div>
            ${sub ? "<div class=\"kpi-sub\">" + escapeHtml(sub) + "</div>" : ""}
        </div>
    `;
}

function pintarDashboard(rows) {
    const compraQty = sumaColumna(rows, "CantidadCompra");
    const ventaQty = sumaColumna(rows, "CantidadVenta");
    const mermaQty = sumaColumna(rows, "CantidadMerma");
    const existQty = sumaColumna(rows, "ExistenciaActual");
    const compraImp = sumaColumna(rows, "CostoTotalCompra");
    const ventaImp = sumaColumna(rows, "VentaTotal");
    const mermaImp = sumaColumna(rows, "CostoTotalMerma");
    const invImp = sumaColumna(rows, "ValorInventario");

    document.getElementById("kpiGrid").innerHTML =
        kpi("Compra", "Costo total", formatoNumero(compraImp, "CostoTotalCompra"), "Cantidad comprada  " + formatoNumero(compraQty, "CantidadCompra")) +
        kpi("Venta", "Importe vendido", formatoNumero(ventaImp, "VentaTotal"), "Cantidad vendida  " + formatoNumero(ventaQty, "CantidadVenta")) +
        kpi("Merma", "Costo de merma", formatoNumero(mermaImp, "CostoTotalMerma"), "Cantidad de merma  " + formatoNumero(mermaQty, "CantidadMerma")) +
        kpi("Inventario", "Valor en inventario", formatoNumero(invImp, "ValorInventario"), "Existencia actual  " + formatoNumero(existQty, "ExistenciaActual"));

    const top = rows.slice().sort(function (a, b) {
        return (aNumero(b.VentaTotal) || 0) - (aNumero(a.VentaTotal) || 0);
    }).slice(0, 8);

    const topQty = rows.slice().sort(function (a, b) {
        return (aNumero(b.CantidadVenta) || 0) - (aNumero(a.CantidadVenta) || 0);
    }).slice(0, 8);

    function etiquetaProducto(r) {
        const n = String(r.NombreProducto || r.CodigoProducto || "");
        return n.length > 22 ? n.slice(0, 21) + "…" : n;
    }

    const labels = top.map(etiquetaProducto);
    const labelsQty = topQty.map(etiquetaProducto);

    const grid = "rgba(90, 200, 160, 0.12)";
    const ticks = { color: "#8aa89c" };

    destruirGraficos();

    graficos.push(new Chart(document.getElementById("chartVentas"), {
        type: "bar",
        data: {
            labels: labels,
            datasets: [{
                label: "Venta total",
                data: top.map(function (r) { return aNumero(r.VentaTotal) || 0; }),
                backgroundColor: "rgba(46, 230, 168, 0.75)"
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: ticks, grid: { color: grid } },
                y: { ticks: ticks, grid: { color: grid } }
            }
        }
    }));

    graficos.push(new Chart(document.getElementById("chartCantidad"), {
        type: "bar",
        data: {
            labels: labelsQty,
            datasets: [{
                label: "Cantidad venta",
                data: topQty.map(function (r) { return aNumero(r.CantidadVenta) || 0; }),
                backgroundColor: "rgba(46, 230, 168, 0.75)"
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: ticks, grid: { color: grid } },
                y: { ticks: ticks, grid: { color: grid } }
            }
        }
    }));

    graficos.push(new Chart(document.getElementById("chartUnidades"), {
        type: "bar",
        data: {
            labels: labels,
            datasets: [
                {
                    label: "Compra",
                    data: top.map(function (r) { return aNumero(r.CantidadCompra) || 0; }),
                    backgroundColor: "rgba(122, 215, 255, 0.8)"
                },
                {
                    label: "Venta",
                    data: top.map(function (r) { return aNumero(r.CantidadVenta) || 0; }),
                    backgroundColor: "rgba(46, 230, 168, 0.8)"
                },
                {
                    label: "Merma",
                    data: top.map(function (r) { return aNumero(r.CantidadMerma) || 0; }),
                    backgroundColor: "rgba(230, 208, 138, 0.85)"
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: "#f4fffb" } } },
            scales: {
                x: { ticks: ticks, grid: { color: grid } },
                y: { stacked: false, ticks: ticks, grid: { color: grid } }
            }
        }
    }));
}

function destruirGraficos() {
    graficos.forEach(function (g) {
        g.destroy();
    });
    graficos = [];
}

function exportarExcel() {

    if (!resultadosActuales || resultadosActuales.length === 0) {
        alert("No hay datos para exportar.");
        return;
    }

    try {
        const visibles = filasVisibles();
        if (visibles.length === 0) {
            alert("No hay datos para exportar.");
            return;
        }
        const worksheet = XLSX.utils.json_to_sheet(visibles);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Tablero");

        const columns = Object.keys(visibles[0]);
        worksheet["!cols"] = columns.map(function (column) {
            let maxLength = column.length;
            visibles.forEach(function (row) {
                let value = row[column];
                if (value === null || value === undefined) {
                    value = "";
                }
                if (typeof value === "object") {
                    value = JSON.stringify(value);
                }
                const length = String(value).length;
                if (length > maxLength) {
                    maxLength = length;
                }
            });
            return { wch: Math.min(maxLength + 2, 50) };
        });

        worksheet["!autofilter"] = { ref: worksheet["!ref"] };

        const inicio = document.getElementById("fechaInicio").value;
        const fin = document.getElementById("fechaFin").value;
        XLSX.writeFile(workbook, "tablero_1_" + inicio + "_" + fin + ".xlsx");

    } catch (error) {
        console.error(error);
        alert("No fue posible generar el archivo Excel.");
    }
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>

</body>
</html>
