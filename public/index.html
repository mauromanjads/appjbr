<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaria · SQL Explorer</title>
    <link rel="stylesheet" href="./css/polaria.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>

<header class="topbar">
    <span class="topbar-date" id="fechaHoy"></span>
    <a class="brand" href="./index.html"><span>✦</span> polaria</a>
    <nav class="topbar-nav">
        <a class="active" href="./index.html">Explorer</a>
        <a href="./dashboard.html">Tablero</a>
        <a href="./migracion.html">Migración</a>
    </nav>
</header>

<div class="page">
    <div class="crumb">Inicio / <b>Explorer</b></div>
    <h1>SQL Explorer</h1>
    <p class="subtitle">Consulta de información SQL Server · solo lectura</p>

    <div class="container">
        <div id="status" class="status waiting">⚪ Esperando consulta...</div>

        <div class="editor">
            <textarea id="sqlQuery">SELECT name FROM sys.databases</textarea>

            <div class="actions">
                <button class="execute" onclick="ejecutarConsulta()">Ejecutar</button>
                <button class="export" onclick="descargarExcel()">Descargar Excel</button>
                <button class="clear" onclick="limpiarConsulta()">Limpiar</button>
                <span class="info">La grilla solo muestra 200 filas. El Excel trae todas.</span>
            </div>

            <div class="warning">
                Esta herramienta está configurada para consultas de solo lectura.
            </div>
        </div>

        <div id="resultContainer"></div>
    </div>

    <p class="footer-note">version: appjbr</p>
</div>

<script>
document.getElementById("fechaHoy").textContent =
    "Fecha " + new Date().toLocaleDateString("es-MX");

const API_URL = "https://fleshed-jittery-swiftly.ngrok-free.dev/query";
const PREVIEW_MAX = 200;

let resultadosActuales = [];

async function consultarSql() {
    const query = document.getElementById("sqlQuery").value.trim();

    if (!query) {
        throw new Error("Escribe una consulta SQL");
    }

    const response = await fetch(API_URL, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "ngrok-skip-browser-warning": "true"
        },
        body: JSON.stringify({ query: query })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
        throw new Error(data.error || "Error ejecutando la consulta");
    }

    return data;
}

async function ejecutarConsulta() {

    const status = document.getElementById("status");
    const resultContainer = document.getElementById("resultContainer");

    status.className = "status waiting";
    status.innerHTML = "Ejecutando consulta...";
    resultContainer.innerHTML = "";

    try {
        const data = await consultarSql();
        status.className = "status success";
        status.innerHTML = "Consulta ejecutada correctamente";
        mostrarResultados(data);
    } catch (error) {
        status.className = "status error";
        status.innerHTML = "Error";
        resultContainer.innerHTML = `
            <div class="warning">${escapeHtml(error.message)}</div>
        `;
    }
}

async function descargarExcel() {

    const status = document.getElementById("status");
    const resultContainer = document.getElementById("resultContainer");

    status.className = "status waiting";
    status.innerHTML = "Consultando y armando Excel... no se pinta la grilla";
    resultContainer.innerHTML = "";

    try {
        const data = await consultarSql();
        resultadosActuales = data.rows || [];
        exportarExcel();
        status.className = "status success";
        status.innerHTML = resultadosActuales.length.toLocaleString("es-MX") +
            " registros exportados a Excel (sin grilla)";
        resultContainer.innerHTML = `
            <div class="empty">
                Listo. El archivo se descargó. La tabla no se dibujó para no saturar el navegador.
            </div>
        `;
    } catch (error) {
        status.className = "status error";
        status.innerHTML = "Error";
        resultContainer.innerHTML = `
            <div class="warning">${escapeHtml(error.message)}</div>
        `;
    }
}

function mostrarResultados(data) {

    const resultContainer = document.getElementById("resultContainer");
    const rows = data.rows || [];
    resultadosActuales = rows;

    if (rows.length === 0) {
        resultContainer.innerHTML = `
            <div class="result-header">
                <h2>Resultado</h2>
                <span class="row-count">0 registros</span>
            </div>
            <div class="empty">La consulta no devolvió registros.</div>
        `;
        return;
    }

    const columns = Object.keys(rows[0]);
    const preview = rows.slice(0, PREVIEW_MAX);
    const recortada = rows.length > PREVIEW_MAX;

    let html = `
        <div class="result-header">
            <h2>Resultado</h2>
            <div class="result-actions">
                <span class="row-count">
                    ${Number(data.rowCount || rows.length).toLocaleString("es-MX")}
                    registro${rows.length === 1 ? "" : "s"}
                    ${recortada ? " · vista previa " + PREVIEW_MAX : ""}
                </span>
                <button class="export" onclick="exportarExcel()">Exportar Excel</button>
            </div>
        </div>
        ${recortada ? "<div class=\"warning\">La grilla solo muestra " + PREVIEW_MAX + " filas. Usa Exportar Excel para el archivo completo.</div>" : ""}
        <div class="table-container">
            <table id="resultTable">
                <thead><tr>
    `;

    columns.forEach((column) => {
        html += "<th>" + escapeHtml(column) + "</th>";
    });

    html += "</tr></thead><tbody>";

    preview.forEach((row) => {
        html += "<tr>";
        columns.forEach((column) => {
            let value = row[column];
            if (value === null || value === undefined) {
                value = "";
            }
            if (typeof value === "object") {
                value = JSON.stringify(value);
            }
            html += "<td>" + escapeHtml(String(value)) + "</td>";
        });
        html += "</tr>";
    });

    html += "</tbody></table></div>";
    resultContainer.innerHTML = html;
}

function exportarExcel() {

    if (!resultadosActuales || resultadosActuales.length === 0) {
        alert("No hay datos para exportar.");
        return;
    }

    try {
        const worksheet = XLSX.utils.json_to_sheet(resultadosActuales);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Resultado");

        const columns = Object.keys(resultadosActuales[0]);
        const muestra = resultadosActuales.slice(0, 80);
        worksheet["!cols"] = columns.map((column) => {
            let maxLength = column.length;
            muestra.forEach((row) => {
                let value = row[column];
                if (value === null || value === undefined) {
                    value = "";
                }
                if (typeof value === "object") {
                    value = JSON.stringify(value);
                }
                const length = String(value).length;
                if (length > maxLength) {
                    maxLength = length;
                }
            });
            return { wch: Math.min(maxLength + 2, 50) };
        });

        worksheet["!autofilter"] = { ref: worksheet["!ref"] };

        const fecha = new Date().toISOString().slice(0, 10);
        XLSX.writeFile(workbook, "resultado_sql_" + fecha + ".xlsx");

    } catch (error) {
        console.error(error);
        alert("No fue posible generar el archivo Excel.");
    }
}

function limpiarConsulta() {
    document.getElementById("sqlQuery").value = "";
    document.getElementById("resultContainer").innerHTML = "";
    resultadosActuales = [];
    const status = document.getElementById("status");
    status.className = "status waiting";
    status.innerHTML = "Esperando consulta...";
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>

</body>
</html>
