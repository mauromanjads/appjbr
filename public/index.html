</div>

<script>

const API_URL = "https://fleshed-jittery-swiftly.ngrok-free.dev/query";

// Guardamos los resultados actuales
let resultadosActuales = [];


/* =========================================================
   EJECUTAR CONSULTA
========================================================= */

async function ejecutarConsulta() {

    const status = document.getElementById("status");
    const resultContainer = document.getElementById("resultContainer");

    const query = document.getElementById("sqlQuery").value.trim();

    if (!query) {

        status.className = "status error";
        status.innerHTML = "🔴 Escribe una consulta SQL";

        return;
    }

    status.className = "status waiting";
    status.innerHTML = "🟡 Ejecutando consulta...";

    resultContainer.innerHTML = "";

    try {

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "ngrok-skip-browser-warning": "true"
            },

            body: JSON.stringify({
                query: query
            })

        });

        const data = await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.error || "Error ejecutando la consulta"
            );

        }

        status.className = "status success";
        status.innerHTML = "🟢 Consulta ejecutada correctamente";

        mostrarResultados(data);

    } catch (error) {

        status.className = "status error";
        status.innerHTML = "🔴 Error";

        resultContainer.innerHTML = `
            <div class="warning">
                ${escapeHtml(error.message)}
            </div>
        `;

    }
}


/* =========================================================
   MOSTRAR RESULTADOS
========================================================= */

function mostrarResultados(data) {

    const resultContainer = document.getElementById("resultContainer");

    const rows = data.rows || [];

    // Guardar resultados para exportación
    resultadosActuales = rows;

    if (rows.length === 0) {

        resultContainer.innerHTML = `

            <div class="result-header">

                <h2>Resultado</h2>

                <span class="row-count">
                    0 registros
                </span>

            </div>

            <div class="empty">
                La consulta no devolvió registros.
            </div>

        `;

        return;
    }


    const columns = Object.keys(rows[0]);


    let html = `

        <div class="result-header">

            <h2>Resultado</h2>

            <div class="result-actions">

                <span class="row-count">
                    ${data.rowCount}
                    registro${data.rowCount === 1 ? "" : "s"}
                </span>

                <button
                    class="export"
                    onclick="exportarExcel()">
                    📊 Exportar Excel
                </button>

            </div>

        </div>


        <div class="table-container">

            <table id="resultTable">

                <thead>

                    <tr>
    `;


    columns.forEach(column => {

        html += `

            <th>
                ${escapeHtml(column)}
            </th>

        `;

    });


    html += `

                    </tr>

                </thead>

                <tbody>

    `;


    rows.forEach(row => {

        html += "<tr>";

        columns.forEach(column => {

            let value = row[column];

            if (value === null || value === undefined) {
                value = "";
            }

            if (typeof value === "object") {
                value = JSON.stringify(value);
            }

            html += `

                <td>
                    ${escapeHtml(String(value))}
                </td>

            `;

        });

        html += "</tr>";

    });


    html += `

                </tbody>

            </table>

        </div>

    `;


    resultContainer.innerHTML = html;

}


/* =========================================================
   EXPORTAR EXCEL
========================================================= */

function exportarExcel() {

    if (!resultadosActuales || resultadosActuales.length === 0) {

        alert("No hay datos para exportar.");

        return;
    }


    try {

        // Crear una hoja de Excel directamente
        const worksheet = XLSX.utils.json_to_sheet(resultadosActuales);


        // Crear el libro de Excel
        const workbook = XLSX.utils.book_new();


        // Agregar la hoja
        XLSX.utils.book_append_sheet(
            workbook,
            worksheet,
            "Resultado"
        );


        // Ajustar automáticamente el ancho de las columnas
        const columns = Object.keys(resultadosActuales[0]);

        worksheet["!cols"] = columns.map(column => {

            let maxLength = column.length;

            resultadosActuales.forEach(row => {

                let value = row[column];

                if (value === null || value === undefined) {
                    value = "";
                }

                if (typeof value === "object") {
                    value = JSON.stringify(value);
                }

                const length = String(value).length;

                if (length > maxLength) {
                    maxLength = length;
                }

            });

            // Limitar el ancho máximo
            return {
                wch: Math.min(maxLength + 2, 50)
            };

        });


        // Activar autofiltro
        worksheet["!autofilter"] = {
            ref: worksheet["!ref"]
        };


        // Fecha para el nombre del archivo
        const fecha = new Date()
            .toISOString()
            .slice(0, 10);


        // Nombre final
        const nombreArchivo =
            `resultado_sql_${fecha}.xlsx`;


        // Descargar Excel
        XLSX.writeFile(
            workbook,
            nombreArchivo
        );

    } catch (error) {

        console.error(error);

        alert(
            "No fue posible generar el archivo Excel."
        );

    }

}


/* =========================================================
   LIMPIAR
========================================================= */

function limpiarConsulta() {

    document.getElementById("sqlQuery").value = "";

    document.getElementById("resultContainer").innerHTML = "";

    resultadosActuales = [];

    const status = document.getElementById("status");

    status.className = "status waiting";

    status.innerHTML = "⚪ Esperando consulta...";

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHtml(value) {

    return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>
